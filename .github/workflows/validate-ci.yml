name: 🧪 CI/CD Validation Test

on:
  workflow_dispatch:
    inputs:
      test_scope:
        description: "Test scope"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - build-only
          - lint-only
          - security-only
          - publish-dry-run
      skip_tests:
        description: "Skip test suites (faster validation)"
        required: false
        default: false
        type: boolean

jobs:
  validate-structure:
    name: Validate Monorepo Structure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate critical folders
        run: |
          echo "📁 Validating monorepo structure..."

          REQUIRED_FOLDERS=(".github" "packages/cli" "packages/pro" "apps")
          MISSING_FOLDERS=()

          for folder in "${REQUIRED_FOLDERS[@]}"; do
            if [ ! -d "$folder" ]; then
              MISSING_FOLDERS+=("$folder")
              echo "❌ Missing: $folder"
            else
              echo "✅ Found: $folder"
            fi
          done

          if [ ${#MISSING_FOLDERS[@]} -gt 0 ]; then
            echo "❌ Validation failed - missing folders: ${MISSING_FOLDERS[*]}"
            exit 1
          fi

          echo "✅ Monorepo structure validation passed"

      - name: Validate package.json files
        run: |
          echo "📦 Validating package configurations..."

          # Check root package.json
          if [ ! -f "package.json" ]; then
            echo "❌ Root package.json missing"
            exit 1
          fi

          # Check packages
          for pkg in cli pro; do
            if [ ! -f "packages/$pkg/package.json" ]; then
              echo "❌ packages/$pkg/package.json missing"
              exit 1
            else
              echo "✅ packages/$pkg/package.json found"
            fi
          done

  validate-build:
    name: Validate Build Process
    runs-on: ubuntu-latest
    if: github.event.inputs.test_scope == 'all' || github.event.inputs.test_scope == 'build-only'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript validation
        run: |
          echo "🔧 Validating TypeScript..."
          pnpm --filter @xagent/one-shot-cli tsc --noEmit
          pnpm --filter @xagent/one-shot-pro tsc --noEmit

      - name: Build packages
        run: |
          echo "🏗️ Testing build process..."
          pnpm --filter @xagent/one-shot-cli build || echo "⚠️ CLI build failed"
          pnpm --filter @xagent/one-shot-pro build || echo "⚠️ Pro build failed"

      - name: Run tests (if not skipped)
        if: github.event.inputs.skip_tests != 'true'
        run: |
          echo "🧪 Running test suites..."
          pnpm test || echo "⚠️ Tests not configured or failed"

  validate-lint:
    name: Validate Linting
    runs-on: ubuntu-latest
    if: github.event.inputs.test_scope == 'all' || github.event.inputs.test_scope == 'lint-only'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint validation
        run: |
          echo "🧹 Validating ESLint..."
          pnpm run lint || echo "⚠️ ESLint validation failed"

      - name: Prettier validation
        run: |
          echo "✨ Checking code formatting..."
          pnpm exec prettier --check "packages/**/*.{ts,tsx,js,jsx}" || echo "⚠️ Formatting issues found"

  validate-security:
    name: Validate Security
    runs-on: ubuntu-latest
    if: github.event.inputs.test_scope == 'all' || github.event.inputs.test_scope == 'security-only'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security audit
        run: |
          echo "🔍 Running security audit..."
          pnpm audit --audit-level moderate

      - name: Check for known vulnerabilities
        run: |
          echo "🛡️ Checking for known vulnerabilities..."
          pnpm audit --json > audit-results.json || true

          # Check for critical vulnerabilities
          if pnpm audit --audit-level critical --json | jq -e '.vulnerabilities | length > 0' > /dev/null 2>&1; then
            echo "❌ Critical vulnerabilities found!"
            pnpm audit --audit-level critical
            exit 1
          fi

          echo "✅ No critical vulnerabilities found"

  validate-publish:
    name: Validate Publishing (Dry Run)
    runs-on: ubuntu-latest
    if: github.event.inputs.test_scope == 'all' || github.event.inputs.test_scope == 'publish-dry-run'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: |
          pnpm --filter @xagent/one-shot-cli build || echo "⚠️ CLI build failed"
          pnpm --filter @xagent/one-shot-pro build || echo "⚠️ Pro build failed"

      - name: Validate CLI package publish
        run: |
          echo "📦 Testing CLI package publish (dry run)..."
          cd packages/cli
          npm publish --dry-run
          echo "✅ CLI package validation passed"

      - name: Validate Pro package publish
        run: |
          echo "🔒 Testing Pro package publish (dry run)..."
          cd packages/pro
          npm publish --dry-run
          echo "✅ Pro package validation passed"

      - name: Test mono-publish script (dry run)
        run: |
          echo "🧪 Testing mono-publish-enhanced.sh script..."
          chmod +x mono-publish-enhanced.sh

          # Test dry run mode
          ./mono-publish-enhanced.sh patch --dry-run
          echo "✅ mono-publish script dry run completed"

  validate-workflows:
    name: Validate Workflow Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate workflow syntax
        run: |
          echo "🔍 Validating GitHub Actions workflow files..."

          # Check for required workflows
          REQUIRED_WORKFLOWS=("ci.yml" "security.yml" "publish.yml" "publish-pro.yml" "multi-repo-sync.yml" "release.yml")

          for workflow in "${REQUIRED_WORKFLOWS[@]}"; do
            if [ -f ".github/workflows/$workflow" ]; then
              echo "✅ Found: $workflow"
            else
              echo "❌ Missing: $workflow"
              exit 1
            fi
          done

          echo "✅ All required workflows present"

      - name: Check workflow permissions
        run: |
          echo "🔒 Checking workflow security permissions..."

          # Basic validation of sensitive operations
          if grep -r "secrets\." .github/workflows/ | grep -v "GITHUB_TOKEN"; then
            echo "⚠️ Custom secrets found in workflows (review required)"
          else
            echo "✅ No custom secrets detected in workflows"
          fi

  summary:
    name: Validation Summary
    runs-on: ubuntu-latest
    needs:
      [
        validate-structure,
        validate-build,
        validate-lint,
        validate-security,
        validate-publish,
        validate-workflows,
      ]
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "## 🧪 CI/CD Validation Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Structure | ${{ needs.validate-structure.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.validate-build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.validate-lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security | ${{ needs.validate-security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Publish | ${{ needs.validate-publish.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Workflows | ${{ needs.validate-workflows.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Test Scope:** ${{ github.event.inputs.test_scope }}" >> $GITHUB_STEP_SUMMARY
          echo "**Skip Tests:** ${{ github.event.inputs.skip_tests }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🎯 **Ready for Production:** $(if [[ '${{ needs.validate-structure.result }}' == 'success' && '${{ needs.validate-workflows.result }}' == 'success' ]]; then echo 'Yes ✅'; else echo 'No ❌'; fi)" >> $GITHUB_STEP_SUMMARY
