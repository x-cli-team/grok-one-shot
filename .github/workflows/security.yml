name: 🔒 Security Analysis

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run weekly security scan on Sundays at 2 AM UTC
    - cron: "0 2 * * 0"

jobs:
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ["javascript"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages for analysis
        run: |
          pnpm --filter @xagent/one-shot-cli build || echo "CLI build failed, continuing analysis"
          pnpm --filter @xagent/one-shot-pro build || echo "Pro build failed, continuing analysis"

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-2.0, GPL-3.0
          comment-summary-in-pr: true

  supply-chain:
    name: Supply Chain Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Audit
        run: |
          echo "🔍 Running comprehensive security audit..."
          pnpm audit --audit-level moderate --json > audit-results.json || true

          # Check for critical vulnerabilities
          if pnpm audit --audit-level critical --json | jq -e '.vulnerabilities | length > 0' > /dev/null 2>&1; then
            echo "❌ Critical vulnerabilities found!"
            pnpm audit --audit-level critical
            exit 1
          fi

          echo "✅ No critical vulnerabilities found"

      - name: License Check
        run: |
          echo "📄 Checking licenses..."
          # Install license checker if not present
          pnpm add -D license-checker || true

          # Check licenses in both packages
          pnpm --filter @xagent/one-shot-cli license-checker --onlyAllow 'MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;Unlicense' || echo "CLI license check completed"
          pnpm --filter @xagent/one-shot-pro license-checker --onlyAllow 'MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;Unlicense' || echo "Pro license check completed"

      - name: Upload audit results
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-results
          path: audit-results.json
          retention-days: 30
