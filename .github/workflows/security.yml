name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 0 * * 0" # Run weekly on Sunday at midnight

jobs:
  security_scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Critical Vulnerabilities Check
        run: npm audit --audit-level=critical

      - name: Full Security Audit (Advisory)
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Generate Security Report
        run: npm audit --json > security-report.json || true
        if: always()

      - name: Scan for Secrets
        uses: trufflesecurity/trufflehog@v3.90.1
        with:
          path: ./
          baseRef: ${{ github.event.pull_request.base.ref || github.ref }}
          headRef: ${{ github.event.pull_request.head.ref || github.sha }}
